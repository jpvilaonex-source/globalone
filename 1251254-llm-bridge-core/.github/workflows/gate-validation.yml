name: 1251254 Master Gate Validation
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1251254-llm-bridge-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Verify master invariants
        run: python -c "import json; c=json.load(open('config/master-reference-1251254.json')); assert all(c['governingControlInvariants'].values()); assert c['operationalStatus']['externalLegalStatus']=='NOT_ASSERTED'; print('1251254 invariants verified')"
